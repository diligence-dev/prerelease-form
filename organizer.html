<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prerelease — Events</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #000;
            background: #fff;
            margin: 0;
            padding: 1cm;
        }
        h1 { font-size: 1.25rem; margin: 0 0 1rem; }
        h2 { font-size: 1rem; margin: 1.5rem 0 0.5rem; }
        .create-form { max-width: 40rem; }
        .create-form label { display: block; margin: 0.5rem 0 0.25rem; font-weight: bold; }
        .create-form input { width: 100%; padding: 0.35rem; box-sizing: border-box; font-size: 0.9rem; border: 1px solid #999; border-radius: 4px; }
        .create-form .row { display: flex; gap: 1rem; }
        .create-form .row > div { flex: 1; }
        .create-form button { margin-top: 1rem; padding: 0.5rem 1.2rem; background: #444; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: #b00020; font-weight: bold; margin-top: 1rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
        th, td { border: 1px solid #000; padding: 0.4em; text-align: left; }
        th { background: #eee; font-weight: bold; }
        a { color: #2563eb; }
    </style>
</head>
<body>
    <h1>Prerelease Events</h1>

    <form class="create-form" method="POST" action="/organizer">
        <h2>Create event</h2>
        <label>Set code (2–8 uppercase alphanumerics, not reserved)</label>
        <input type="text" name="set_code" required pattern="[A-Z0-9]{2,8}">
        <div class="row">
            <div>
                <label>Date (yyyy-mm-dd)</label>
                <input type="date" name="date" required>
            </div>
            <div>
                <label>Time (24h)</label>
                <input type="time" name="time" required value="17:30">
            </div>
        </div>
        <label>What (English)</label>
        <input type="text" name="what_en" required value="Draft & Sealed from English Play Booster Displays (no Prerelease Packs), 3-round-tournament, no prizes">
        <label>What (German)</label>
        <input type="text" name="what_de" required value="Draft & Sealed aus englischen Play Booster Displays (keine Prerelease Packs), 3-Runden-Turnier, keine Preise">
        <label>Where (English)</label>
        <input type="text" name="where_en" required value="Ziegelstr. 4, 10117 Berlin; same Location as weekly draft: ">
        <label>Where (German)</label>
        <input type="text" name="where_de" required value="Ziegelstr. 4, 10117 Berlin; gleicher Ort wie wöchentlicher Draft: ">
        <label>Where link (English URL)</label>
        <input type="text" name="where_link_en" value="https://mtg-cube.de/hedwig-english/">
        <label>Where link (German URL)</label>
        <input type="text" name="where_link_de" value="https://mtg-cube.de/hedwig">
        <div class="row">
            <div>
                <label>Draft capacity</label>
                <input type="number" name="draft_cap" required min="1" value="24">
            </div>
            <div>
                <label>Sealed capacity</label>
                <input type="number" name="sealed_cap" required min="1" value="8">
            </div>
        </div>
        <div class="row">
            <div>
                <label>Draft price (€)</label>
                <input type="number" name="draft_price" required min="0.01" step="0.01" value="12.50">
            </div>
            <div>
                <label>Sealed price (€)</label>
                <input type="number" name="sealed_price" required min="0.01" step="0.01" value="25">
            </div>
        </div>
        <button type="submit">Create event</button>
        {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    </form>

    <h2>Events</h2>
    {{if .Events}}
    <table>
        <thead>
            <tr>
                <th>Set code</th>
                <th>Date</th>
                <th>Draft</th>
                <th>Sealed</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {{range .Events}}<tr>
                <td>{{.SetCode}}</td>
                <td>{{.Date}}</td>
                <td>{{.DraftCount}}/{{.DraftCap}}</td>
                <td>{{.SealedCount}}/{{.SealedCap}}</td>
                <td><a href="/organizer/{{.SetCode}}">open</a></td>
            </tr>
            {{end}}
        </tbody>
    </table>
    {{else}}
    <p>No events yet.</p>
    {{end}}
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Thanks</title>
	<style>
		body {
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			line-height: 1.6;
			margin: 0;
			padding: 2rem 1rem;
			color: #222;
			background: #f5f6f8;
			display: flex;
			justify-content: center;
		}
		.card {
			max-width: 40rem;
			width: 100%;
			background: #fff;
			padding: 2rem;
			border-radius: 0.75rem;
			box-shadow: 0 1px 4px rgba(0,0,0,0.08);
			box-sizing: border-box;
		}
	</style>
</head>
<body>
	<div class="card">
		<h1>Thanks!</h1>
		<p>You'll receive an email with payment details shortly. If you don't see it within a few minutes, check your spam folder.</p>
	</div>
</body>
</html>

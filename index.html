<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{T .Lang "prerelease_signup"}}</title>
	<style>
		body {
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			line-height: 1.6;
			margin: 0;
			padding: 2rem 1rem;
			color: #222;
			background: #f5f6f8;
			display: flex;
			justify-content: center;
		}
		.card {
			max-width: 40rem;
			width: 100%;
			background: #fff;
			padding: 2rem;
			border-radius: 0.75rem;
			box-shadow: 0 1px 4px rgba(0,0,0,0.08);
			box-sizing: border-box;
		}
		h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
		.note { color: #555; margin: 0 0 1.5rem; }
		.note-table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
		.note-table th, .note-table td { text-align: left; padding: 0.25rem 0; vertical-align: top; }
		.note-table th { width: 5.5rem; font-weight: normal; color: #666; }
		label { display: block; margin-top: 1rem; font-weight: 600; }
		input[type="text"], input[type="email"] {
			width: 100%;
			padding: 0.5rem;
			font-size: 1rem;
			box-sizing: border-box;
			border: 1px solid #ccc;
			border-radius: 0.375rem;
		}
		input[type="text"]:focus, input[type="email"]:focus {
			outline: none;
			border-color: #2563eb;
			box-shadow: 0 0 0 2px rgba(37,99,235,0.2);
		}
		fieldset { border: none; padding: 0; margin: 1rem 0 0; }
		legend { font-weight: 600; }
		.options { display: flex; flex-wrap: wrap; gap: 1.5rem; margin-top: 0.5rem; }
		.options label { font-weight: normal; margin-top: 0; }
		.option { margin-top: 1rem; font-weight: normal; display: block; }
		button {
			margin-top: 1.5rem;
			padding: 0.75rem 1.25rem;
			font-size: 1rem;
			cursor: pointer;
			border: none;
			border-radius: 0.375rem;
			background: #2563eb;
			color: #fff;
		}
		button:hover { background: #1d4ed8; }
		.lang-switch {
			display: flex;
			justify-content: center;
		}
		.lang-switch button {
			margin: 0;
			padding: 0.5rem 0.75rem;
			font-size: 0.875rem;
			background: #e5e7eb;
			color: #374151;
		}
		.lang-switch button:hover { background: #d1d5db; }
	</style>
</head>
<body>
	<div class="card">
		<div class="lang-switch">
			<a href="/{{if eq .Lang "en"}}de{{else}}en{{end}}/"><button type="button">{{if eq .Lang "en"}}Deutsch{{else}}English{{end}}</button></a>
		</div>
		<h1>{{T .Lang "prerelease_signup"}}</h1>

		<table class="note-table">
			<tr>
				<th>{{T .Lang "note_what_label"}}:</th>
				<td>{{T .Lang "note_what_value"}}</td>
			</tr>
			<tr>
				<th>{{T .Lang "note_when_label"}}:</th>
				<td>{{T .Lang "note_when_value"}}</td>
			</tr>
			<tr>
				<th>{{T .Lang "note_where_label"}}:</th>
				<td>{{T .Lang "note_where_value"}} <a href="https://mtg-cube.de/hedwig-english/">{{T .Lang "note_where_link"}}</a></td>
			</tr>
		</table>

		<form method="POST" action="/{{.Lang}}/submit">
			<label for="email">{{T .Lang "label_email"}}</label>
			<input type="email" id="email" name="email" required>

			<label for="name">{{T .Lang "label_name"}}</label>
			<input type="text" id="name" name="name" required maxlength="200">

			<fieldset>
				<legend>{{T .Lang "legend_format"}}</legend>
				<div class="options">
					<label><input type="radio" name="format" value="draft" required> Draft €15 ({{.DraftSeatsLeft}} {{T .Lang "seats_left"}}{{if eq .DraftSeatsLeft 0}}{{T .Lang "waitlist_suffix"}}{{end}})</label>
					<label><input type="radio" name="format" value="sealed" required> Sealed €30 ({{.SealedSeatsLeft}} {{T .Lang "seats_left"}}{{if eq .SealedSeatsLeft 0}}{{T .Lang "waitlist_suffix"}}{{end}})</label>
				</div>
			</fieldset>

			<label class="option"><input type="checkbox" name="cancellation_ack" required> {{T .Lang "cancellation_ack_label"}}</label>

			<label class="option"><input type="checkbox" name="data_consent" required> {{T .Lang "data_consent_label"}}</label>

			<label class="option"><input type="checkbox" name="mailing_list" value="yes"> {{T .Lang "mailing_list_label"}}</label>

			<button type="submit">{{T .Lang "button_signup"}}</button>
		</form>
	</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Prerelease Signup</title>
	<style>
		body {
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			line-height: 1.6;
			margin: 0;
			padding: 1rem;
			max-width: 40rem;
			color: #222;
		}
		h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
		.note { color: #555; margin-bottom: 1.5rem; }
		label { display: block; margin-top: 1rem; font-weight: 600; }
		input[type="text"], input[type="email"] {
			width: 100%;
			padding: 0.5rem;
			font-size: 1rem;
			box-sizing: border-box;
		}
		fieldset { border: none; padding: 0; margin: 1rem 0 0; }
		legend { font-weight: 600; }
		.option { margin-top: 0.5rem; font-weight: normal; }
		button {
			margin-top: 1.5rem;
			padding: 0.75rem 1.25rem;
			font-size: 1rem;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<h1>Prerelease Signup</h1>

	<p class="note">
	What: Draft & Sealed from English Play Booster Displays (no Prerelease Packs), 3-round-tournament, no prizes<br>
	When: 7 August 2026 at 17:30<br>
	Where: Ziegelstr. 4, 10117 Berlin; same Location as weekly draft: <a href="https://mtg-cube.de/hedwig-english/">how to find us</a>
	</p>

	<form method="POST" action="/submit">
		<label for="email">Email</label>
		<input type="email" id="email" name="email" required>

		<label for="name">Name</label>
		<input type="text" id="name" name="name" required maxlength="200">

		<fieldset>
			<legend>Format</legend>
			<div class="option">
				<label><input type="radio" name="format" value="draft" required> Draft €15 ({{.DraftSeatsLeft}} seats left{{if eq .DraftSeatsLeft 0}} -> waitlist{{end}})</label>
			</div>
			<div class="option">
				<label><input type="radio" name="format" value="sealed" required> Sealed €30 ({{.SealedSeatsLeft}} seats left{{if eq .SealedSeatsLeft 0}} -> waitlist{{end}})</label>
			</div>
		</fieldset>

		<div class="option">
			<label><input type="checkbox" name="cancellation_ack" required> I will email magicdraftberlin@posteo.de if I cannot come or am delayed</label>
		</div>

		<fieldset>
			<legend>Join Mailing list for MtG (prerelease) events?</legend>
			<div class="option">
				<label><input type="radio" name="mailing_list" value="yes" required> Yes, keep me posted</label>
			</div>
			<div class="option">
				<label><input type="radio" name="mailing_list" value="no" required> No</label>
			</div>
		</fieldset>

		<div class="option">
			<label><input type="checkbox" name="data_consent" required> I consent to my data being processed for this event</label>
		</div>

		<button type="submit">Sign up</button>
	</form>
</body>
</html>

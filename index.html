<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Prerelease Signup</title>
	<style>
		body {
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			line-height: 1.6;
			margin: 0;
			padding: 2rem 1rem;
			color: #222;
			background: #f5f6f8;
			display: flex;
			justify-content: center;
		}
		.card {
			max-width: 40rem;
			width: 100%;
			background: #fff;
			padding: 2rem;
			border-radius: 0.75rem;
			box-shadow: 0 1px 4px rgba(0,0,0,0.08);
			box-sizing: border-box;
		}
		h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
		.note { color: #555; margin: 0 0 1.5rem; }
		label { display: block; margin-top: 1rem; font-weight: 600; }
		input[type="text"], input[type="email"] {
			width: 100%;
			padding: 0.5rem;
			font-size: 1rem;
			box-sizing: border-box;
			border: 1px solid #ccc;
			border-radius: 0.375rem;
		}
		input[type="text"]:focus, input[type="email"]:focus {
			outline: none;
			border-color: #2563eb;
			box-shadow: 0 0 0 2px rgba(37,99,235,0.2);
		}
		fieldset { border: none; padding: 0; margin: 1rem 0 0; }
		legend { font-weight: 600; }
		.options { display: flex; flex-wrap: wrap; gap: 1.5rem; margin-top: 0.5rem; }
		.options label { font-weight: normal; margin-top: 0; }
		.option { margin-top: 1rem; font-weight: normal; display: block; }
		button {
			margin-top: 1.5rem;
			padding: 0.75rem 1.25rem;
			font-size: 1rem;
			cursor: pointer;
			border: none;
			border-radius: 0.375rem;
			background: #2563eb;
			color: #fff;
		}
		button:hover { background: #1d4ed8; }
	</style>
</head>
<body>
	<div class="card">
		<h1>Prerelease Signup</h1>

		<p class="note">
		What: Draft & Sealed from English Play Booster Displays (no Prerelease Packs), 3-round-tournament, no prizes<br>
		When: 7 August 2026 at 17:30<br>
		Where: Ziegelstr. 4, 10117 Berlin; same Location as weekly draft: <a href="https://mtg-cube.de/hedwig-english/">how to find us</a>
		</p>

		<form method="POST" action="/submit">
			<label for="email">Email</label>
			<input type="email" id="email" name="email" required>

			<label for="name">Name</label>
			<input type="text" id="name" name="name" required maxlength="200">

			<fieldset>
				<legend>Format</legend>
				<div class="options">
					<label><input type="radio" name="format" value="draft" required> Draft €15 ({{.DraftSeatsLeft}} seats left{{if eq .DraftSeatsLeft 0}} -> waitlist{{end}})</label>
					<label><input type="radio" name="format" value="sealed" required> Sealed €30 ({{.SealedSeatsLeft}} seats left{{if eq .SealedSeatsLeft 0}} -> waitlist{{end}})</label>
				</div>
			</fieldset>

			<label class="option"><input type="checkbox" name="cancellation_ack" required> I will email magicdraftberlin@posteo.de if I cannot come or am delayed</label>

			<label class="option"><input type="checkbox" name="data_consent" required> I consent to my data being processed for this event</label>

			<label class="option"><input type="checkbox" name="mailing_list" value="yes"> Optional: Join Mailing list for MtG (prerelease) events</label>

			<button type="submit">Sign up</button>
		</form>
	</div>
</body>
</html>

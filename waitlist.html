<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{T .Lang "title_waitlist"}}</title>
	<style>
		body {
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			line-height: 1.6;
			margin: 0;
			padding: 2rem 1rem;
			color: #222;
			background: #f5f6f8;
			display: flex;
			justify-content: center;
		}
		.card {
			max-width: 40rem;
			width: 100%;
			background: #fff;
			padding: 2rem;
			border-radius: 0.75rem;
			box-shadow: 0 1px 4px rgba(0,0,0,0.08);
			box-sizing: border-box;
		}
		h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
		.note { color: #555; margin: 0; }
	</style>
</head>
<body>
	<div class="card">
		<h1>{{T .Lang "heading_waitlist"}}</h1>
		<p class="note">{{T .Lang "waitlist_body_pre"}}<a href="/{{.SetCode}}/{{.Lang}}/cancel">{{T .Lang "waitlist_cancel_link"}}</a>.</p>
	</div>
</body>
</html>

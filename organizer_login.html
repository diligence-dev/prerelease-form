<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prerelease — Organizer Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }
        .card {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            max-width: 24rem;
            width: 100%;
        }
        h1 {
            font-size: 1.25rem;
            margin: 0 0 1.5rem;
        }
        label {
            display: block;
            margin: 0.75rem 0 0.25rem;
            font-weight: bold;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #999;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            margin-top: 1.5rem;
            padding: 0.6rem 1.2rem;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background: #333;
        }
        .error {
            color: #b00020;
            margin-top: 1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <form class="card" method="post" action="/organizer/login">
        <h1>Organizer Login</h1>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="organizer" autocomplete="username" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
        <button type="submit">Log in</button>
        {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    </form>
</body>
</html>
